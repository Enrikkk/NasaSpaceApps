[pytest]
testpaths = tests
# starlette 1.x recomienda httpx2 para TestClient; mantenemos httpx 0.28.1 (BSD-3, conocido) y silenciamos el aviso.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
