[pytest]
testpaths = tests
# raiz del repo (api -> backend -> app -> raiz) para `import app.backend...`
pythonpath = ../../..
# starlette 1.x recomienda httpx2 para TestClient; se mantiene httpx 0.28.1 (BSD-3, conocido) y se silencia el aviso.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
